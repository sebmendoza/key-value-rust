[package]
name = "kvs"
version = "0.1.0"
authors = ["Sebastian Mendoza sebastian.mendoza@uwaterloo.ca"]
description = "A key-value store"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.18", features = ["cargo", "derive"] }
clap_derive = { version = "4.0.0-rc.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.1"
anyhow = "1.0.89"
thiserror = "1.0.64"
log = "0.4"
env_logger = "0.10"
sled = "0.34.7"

[dev-dependencies]
assert_cmd = "0.11"
criterion = "0.3"
predicates = "1.0.0"
rand = "0.6.5"
tempfile = "3.0.7"
walkdir = "2.2.7"

[[bench]]
name = "kvs_benchmark"
harness = false